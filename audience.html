<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n="audience_page_title">AskIf — 現場提問</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/config.js"></script>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <h3 id="room-id-tag">
      <span data-i18n="room_label">房號</span>: <span id="room-id-text" style="color:var(--accent);">------</span>
    </h3>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <button id="lang-toggle" onclick="toggleLanguage()" class="btn" style="font-size:0.75rem; padding:0.25rem 0.5rem;">EN</button>
      <span class="badge badge-peer" id="status-dot">◌ 連線中...</span>
    </div>
  </div>

  <!-- 焦點題目卡片 -->
  <div id="spotlight-box" class="card" style="display:none; background:#1e293b; color:#fff; border-left:4px solid #3b82f6; margin-bottom:1rem; padding:1rem;"></div>

  <!-- 提問表單 -->
  <div class="card">
    <form id="ask-form">
      <textarea id="ask-input" data-i18n-placeholder="ask_placeholder" placeholder="請輸入您的問題（限 150 字）..." rows="3" maxlength="150" style="width:100%; box-sizing:border-box;"></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center; margin:0.5rem 0;">
        <span id="char-count" style="font-size:0.75rem; color:var(--text-muted);">0/150</span>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;" data-i18n="btn_submit">送出提問</button>
    </form>
  </div>

  <h4 style="margin: 1.5rem 0 0.5rem 0;" data-i18n="display_leaderboard">熱門提問榜</h4>
  <div id="question-list"></div>

  <script type="module" src="./js/i18n.js"></script>
  <script type="module" src="./js/audience.js"></script>
</body>
</html>
