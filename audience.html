<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AskIf — 現場提問</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/config.js"></script>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <h3 id="room-id-tag">現場提問室</h3>
    <span class="badge badge-peer" id="status-dot">連線中...</span>
  </div>

  <div class="card">
    <textarea id="question-input" placeholder="輸入你想探討的問題（限 150 字）..." rows="3" maxlength="150"></textarea>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
      <span id="char-count" style="font-size:0.75rem; color:var(--text-muted);">0/150</span>
    </div>
    <button class="btn btn-primary" id="submit-btn" style="width:100%;" onclick="submitQuestion()">送出提問</button>
  </div>

  <h4 style="margin: 1.5rem 0 0.5rem 0;">🔥 精選提問池</h4>
  <div id="questions-pool"></div>

  <script type="module" src="./js/audience.js"></script>
</body>
</html>
