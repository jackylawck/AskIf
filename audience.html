<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskIf — Audience Q&A</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      background: #21262d;
      padding: 0.2rem;
      border-radius: 6px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #30363d;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <div>
      <h2 style="margin:0;"><span data-i18n="room">房號</span>：<span id="room-id-label" style="color:var(--accent);">------</span></h2>
      <span class="badge" id="sync-badge" style="color:#ff7675;">○ <span data-i18n="disconnected">斷線</span></span>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-zh" onclick="setLang('zh')">繁中</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="card">
    <textarea id="question-input" rows="4" maxlength="200" style="width:100%; box-sizing:border-box; resize:none;" placeholder="輸入你想探討的問題（限 200 字）..."></textarea>
    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#888; margin-top:0.25rem;">
      <span id="char-count">0/200</span>
    </div>
    <button class="btn btn-primary" id="submit-btn" style="width:100%; margin-top:0.75rem;" data-i18n="submit">送出提問</button>
  </div>

  <div id="toast" style="display:none; margin-top:1rem; padding:0.75rem; border-radius:6px; background:#1e88e5; color:#fff; font-size:0.9rem; text-align:center;"></div>

  <h3 style="margin-top:1.5rem; font-size:1.1rem;">🔥 <span data-i18n="featuredPool">精選提問池</span></h3>
  <div id="approved-pool"></div>

  <script type="module">
    import { Relay } from './js/relay.js';

    // 雙語文字字典
    const i18n = {
      zh: {
        room: '房號',
        connected: '已連線',
        disconnected: '斷線',
        placeholder: '輸入你想探討的問題（限 200 字）...',
        submit: '送出提問',
        featuredPool: '精選提問池',
        successMsg: '提問已送達後台審核隊列！',
        emptyMsg: '請輸入問題內容！',
        rateLimitMsg: '提問太頻繁，請稍候 30 秒。',
        upvoted: '已附議'
      },
      en: {
        room: 'Room',
        connected: 'Connected',
        disconnected: 'Offline',
        placeholder: 'Ask a question (Max 200 chars)...',
        submit: 'Submit Question',
        featuredPool: 'Featured Questions',
        successMsg: 'Question submitted for review!',
        emptyMsg: 'Please enter your question.',
        rateLimitMsg: 'Please wait 30 seconds before submitting again.',
        upvoted: 'Upvoted'
      }
    };

    let currentLang = 'zh';

    window.setLang = function(lang) {
      currentLang = lang;
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });

      document.getElementById('question-input').placeholder = i18n[lang].placeholder;
    };

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || '888888';
    document.getElementById('room-id-label').textContent = roomId;

    const relay = new Relay(roomId, 'AUDIENCE');

    const input = document.getElementById('question-input');
    const charCount = document.getElementById('char-count');
    input.addEventListener('input', () => {
      charCount.textContent = `${input.value.length}/200`;
    });

    // 匿名指紋 ID
    let cid = localStorage.getItem('askif_cid');
    if (!cid) {
      cid = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('askif_cid', cid);
    }

    relay.onMessage((msg) => {
      const badge = document.getElementById('sync-badge');
      if (msg.type === 'STATUS') {
        if (msg.status === 'ONLINE') {
          badge.innerHTML = `● <span data-i18n="connected">${i18n[currentLang].connected}</span>`;
          badge.style.color = '#00b894';
        } else {
          badge.innerHTML = `○ <span data-i18n="disconnected">${i18n[currentLang].disconnected}</span>`;
          badge.style.color = '#ff7675';
        }
        return;
      }

      if (msg.type === 'STATE' && Array.isArray(msg.questions)) {
        renderPool(msg.questions);
      }
    });

    document.getElementById('submit-btn').onclick = () => {
      const text = input.value.trim();
      if (!text) {
        showToast(i18n[currentLang].emptyMsg);
        return;
      }

      relay.send({
        type: 'SUBMIT',
        text: text,
        cid: cid
      });

      input.value = '';
      charCount.textContent = '0/200';
      showToast(i18n[currentLang].successMsg);
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function renderPool(questions) {
      const pool = document.getElementById('approved-pool');
      pool.replaceChildren();
      questions.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.display = 'flex';
        card.style.justifyContent = 'space-between';
        card.style.alignItems = 'center';

        const textEl = document.createElement('div');
        textEl.textContent = q.text;
        textEl.style.fontSize = '0.95rem';

        const upvoteBtn = document.createElement('button');
        upvoteBtn.className = 'btn';
        upvoteBtn.style.padding = '0.3rem 0.6rem';
        upvoteBtn.textContent = `▲ ${q.upvotes}`;
        upvoteBtn.onclick = () => {
          relay.send({ type: 'UPVOTE', qid: q.qid, cid: cid });
        };

        card.appendChild(textEl);
        card.appendChild(upvoteBtn);
        pool.appendChild(card);
      });
    }
  </script>
</body>
</html>
