  <!-- 統一引入核心設計系統 -->
  <link rel="stylesheet" href="./css/style.css">

  <style>
    :root {
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding-top: 1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      background: var(--card);
      padding: 0.25rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 2.25rem;
    }
    .hero-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .join-grid {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .join-input {
      flex: 1;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 3px;
    }

    @media (max-width: 420px) {
      .join-grid {
        flex-direction: column;
      }
      .join-input {
        width: 100%;
      }
    }

    details.compliance-card {
      margin-top: 1.5rem;
      background: rgba(22, 27, 34, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    details.compliance-card[open] {
      background: rgba(22, 27, 34, 0.95);
      border-color: var(--card-border);
    }
    details.compliance-card summary {
      font-weight: 700;
      color: var(--text);
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    details.compliance-card summary::-webkit-details-marker {
      display: none;
    }
    .summary-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .summary-toggle {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: normal;
      margin-left: 0.5rem;
      flex-shrink: 0;
    }

    .compliance-content {
      margin-top: 0.85rem;
      cursor: default;
    }
    .badge-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.6rem 0;
    }
    .comp-badge {
      background: #1f2937;
      color: var(--accent);
      border: 1px solid #374151;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      transform: scale(0.92);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.open .modal-box {
      transform: scale(1);
    }
    .password-hint {
      background: rgba(13, 17, 23, 0.85);
      border-left: 3px solid var(--accent);
      padding: 0.6rem 0.75rem;
      border-radius: 4px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0.85rem 0 1rem;
      line-height: 1.5;
    }
    .error-text {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="brand-logo">AskIf</div>
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-zh">繁中</button>
        <button class="lang-btn" id="btn-en">EN</button>
      </div>
    </div>

    <div class="hero-section">
      <h1 class="hero-title" data-i18n="title">現場即時互動問答</h1>
      <p class="hero-subtitle" data-i18n="subtitle">純邊緣記憶體運算・無痕私隱防護・會後即時銷毀</p>
    </div>

    <!-- 主持人開房入口 -->
    <div class="card">
      <h3 style="font-size:1.15rem;" data-i18n="hostSectionTitle">🎙️ 主辦人 / 主持人入口</h3>
      <p style="font-size:0.875rem;" data-i18n="hostDesc">建立專屬議程房間，獲取大螢幕投影連結與即時審題戰情室。</p>
      <button class="btn btn-primary" id="btn-open-modal" style="width:100%; margin-top:0.75rem;" data-i18n="createRoomBtn">建立新會議房間</button>
    </div>

    <!-- 觀眾加入入口 -->
    <div class="card">
      <h3 style="font-size:1.15rem;" data-i18n="audienceSectionTitle">📱 觀眾加入既有房間</h3>
      <p style="font-size:0.875rem;" data-i18n="audienceDesc">請輸入主辦方大螢幕提供的 6 位數字房間代碼：</p>
      <div class="join-grid">
        <input type="text" id="manual-room-input" class="join-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="例如: 250720">
        <button class="btn btn-primary" id="btn-join-room" style="padding: 0 1.25rem; font-weight:600;" data-i18n="joinBtn">進入</button>
      </div>
    </div>

    <!-- 可折疊合規卡片 -->
    <details class="compliance-card" id="compliance-details">
      <summary>
        <div class="summary-title" data-i18n="complianceTitle">🛡️ 企業級資安與全球私隱合規架構</div>
        <div class="summary-toggle" id="compliance-toggle-label">＋ 展開</div>
      </summary>
      <div class="compliance-content">
        <div class="badge-grid" id="badge-container"></div>
        <div id="compliance-desc" data-i18n="complianceBody"></div>
      </div>
    </details>
  </div>

  <!-- 主持人自訂密碼彈窗 -->
  <div id="pwd-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h3 id="modal-title" style="margin-top:0; font-size:1.15rem;" data-i18n="modalTitle">🔑 自訂主持人管理密碼</h3>
      
      <div class="password-hint">
        <strong data-i18n="hintTitle">💡 設定指引：</strong><br>
        <span data-i18n="hintDesc">請自訂 4~16 位數字或英文字母作為本場會議的管理密碼。您將使用此密碼管理審核與投影大螢幕；現場觀眾直接掃碼提問，免密碼即可加入。</span>
      </div>

      <input type="password" id="modal-password" maxlength="16" autocomplete="new-password" placeholder="請自訂管理密碼 (例如: pass888)">
      <div id="modal-error" class="error-text"></div>

      <div class="modal-actions">
        <button class="btn" id="btn-cancel-modal" data-i18n="cancelBtn">取消</button>
        <button class="btn btn-primary" id="confirm-create-btn" data-i18n="confirmBtn">確認開房</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { applyI18n, getSavedLang, TRANSLATIONS } from './js/i18n.js';

    let currentLang = getSavedLang();
    document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
    applyI18n(currentLang);
    renderBadges();
    updateToggleText();
    updatePlaceholders(currentLang);

    function updatePlaceholders(lang) {
      const roomInput = document.getElementById('manual-room-input');
      if (roomInput) {
        roomInput.placeholder = lang === 'zh' ? '例如: 250720' : 'e.g. 250720';
      }
    }

    function updateToggleText() {
      const details = document.getElementById('compliance-details');
      const label = document.getElementById('compliance-toggle-label');
      if (!label || !details) return;
      if (details.open) {
        label.textContent = currentLang === 'zh' ? '－ 收起' : '－ Hide';
      } else {
        label.textContent = currentLang === 'zh' ? '＋ 展開' : '＋ View';
      }
    }

    document.getElementById('compliance-details').addEventListener('toggle', updateToggleText);

    function renderBadges() {
      const container = document.getElementById('badge-container');
      if (!container) return;
      container.replaceChildren();

      const standards = [
        'ISO/IEC 27001 (InfoSec)',
        'ISO/IEC 27701 (Privacy)',
        'GDPR Data Minimization',
        'HK PDPO (香港私隱條例)',
        'Zero-Persistence Architecture'
      ];

      standards.forEach((text) => {
        const badge = document.createElement('span');
        badge.className = 'comp-badge';
        badge.textContent = text;
        container.appendChild(badge);
      });
    }

    document.getElementById('btn-zh').addEventListener('click', () => {
      currentLang = 'zh';
      document.documentElement.lang = 'zh-HK';
      applyI18n('zh');
      updateToggleText();
      updatePlaceholders('zh');
    });

    document.getElementById('btn-en').addEventListener('click', () => {
      currentLang = 'en';
      document.documentElement.lang = 'en';
      applyI18n('en');
      updateToggleText();
      updatePlaceholders('en');
    });

    const modal = document.getElementById('pwd-modal');
    const pwdInput = document.getElementById('modal-password');
    const errBox = document.getElementById('modal-error');
    const submitBtn = document.getElementById('confirm-create-btn');

    function openModal() {
      errBox.style.display = 'none';
      pwdInput.value = '';
      modal.classList.add('open');
      setTimeout(() => pwdInput.focus(), 150);
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    document.getElementById('btn-open-modal').addEventListener('click', openModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('open')) {
        closeModal();
      }
    });

    // 觀眾加入契約：傳遞純 6 位數字房號
    document.getElementById('btn-join-room').addEventListener('click', () => {
      const input = document.getElementById('manual-room-input').value.trim();
      const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.zh;
      if (/^\d{6}$/.test(input)) {
        window.location.href = `./audience.html?room=${encodeURIComponent(input)}`;
      } else {
        alert(dict.errorInvalidRoom || '請輸入正確的 6 位數字房號');
      }
    });

    document.getElementById('manual-room-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btn-join-room').click();
      }
    });

    // 主持人開房契約：雙重寫入 sessionStorage 並由 URL fragment 傳送即焚密碼
    submitBtn.addEventListener('click', async () => {
      const pwd = pwdInput.value.trim();
      const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.zh;

      if (pwd.length < 4 || pwd.length > 16) {
        errBox.textContent = dict.errorWrongPwd || '密碼格式需為 4 至 16 位字元';
        errBox.style.display = 'block';
        return;
      }

      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = dict.creating || '正在建立房間...';

      try {
        const resp = await fetch('https://askif-relay.jackylawck.workers.dev/api/create-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (resp.status === 503) {
          const errData = await resp.json().catch(() => ({}));
          errBox.textContent = errData.error || '活躍房間已達上限，請稍候再試。';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = dict.confirmBtn || '確認開房';
          return;
        }

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.error || '開房失敗，請檢查網路連線');
        }

        const data = await resp.json();
        if (!data.ticket) {
          throw new Error('伺服器未回傳有效票據 (Ticket)');
        }

        sessionStorage.setItem(`askif_host_pwd_${data.roomId}`, pwd);
        sessionStorage.setItem(`askif_host_pwd_${data.ticket}`, pwd);

        window.location.href = `./host.html?room=${encodeURIComponent(data.ticket)}#key=${encodeURIComponent(pwd)}`;
      } catch (err) {
        console.error('[Create Room Error]:', err);
        errBox.textContent = err.message || dict.errorNet || '連線伺服器失敗，請稍候再試';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = dict.confirmBtn || '確認開房';
      }
    });

    pwdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitBtn.click();
      }
    });
  </script>
</body>
</html>
