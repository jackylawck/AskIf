<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskIf — 主持人戰情 Pad | Host Moderation</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      background: #21262d;
      padding: 0.2rem;
      border-radius: 6px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #388bfd;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <div>
      <h2><span data-i18n="room">房號</span>：<span id="room-id-label" style="color:var(--accent);">------</span></h2>
      <span class="badge badge-online" id="sync-badge" data-i18n="syncCloud">連線同步中...</span>
    </div>
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <div class="lang-switcher">
        <button class="lang-btn" id="btn-zh" onclick="window.switchHostLang('zh')">繁中</button>
        <button class="lang-btn" id="btn-en" onclick="window.switchHostLang('en')">EN</button>
      </div>
      <a class="btn" id="open-display-btn" target="_blank" style="font-size:0.8rem; padding:0.4rem 0.8rem;" data-i18n="openDisplayBtn">🖥️ 開大螢幕</a>
    </div>
  </div>

  <div class="card" style="display:flex; gap:1rem; align-items:center;">
    <div class="qr-box" id="host-qr"></div>
    <div>
      <p style="font-weight:600;" data-i18n="scanQrHint">📱 觀眾現場掃碼加入</p>
      <p style="font-size:0.75rem; margin-top:0.25rem;" data-i18n="destroyHint">純記憶體運作，關閉分頁即物理銷毀。</p>
    </div>
  </div>

  <h3 style="margin-top:1.5rem; font-size:1.1rem;"><span data-i18n="inboxTitle">📥 待審題庫</span> (<span id="inbox-count">0</span>)</h3>
  <div id="inbox-list"></div>

  <h3 style="margin-top:1.5rem; font-size:1.1rem;"><span data-i18n="approvedTitle">🚀 候選與大螢幕推題</span> (<span id="approved-count">0</span>)</h3>
  <div id="approved-list"></div>

  <script type="module">
    import { applyI18n, getSavedLang } from './js/i18n.js';

    // 初始化讀取全站儲存的語言
    let currentLang = getSavedLang();
    applyI18n(currentLang);

    window.switchHostLang = function(lang) {
      applyI18n(lang);
      // 若 host.js 有註冊全域重繪函數則觸發更新按鈕文字
      if (typeof window.renderHostLists === 'function') {
        window.renderHostLists();
      }
    };
  </script>
  <script type="module" src="./js/host.js"></script>
</body>
</html>
