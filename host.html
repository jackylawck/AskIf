<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskIf — 主持人戰情 Pad | Host Moderation</title>

  <!-- 📱 圖示與 PWA 支援，解決 favicon.ico 404 -->
  <link rel="icon" type="image/png" sizes="192x192" href="./AskIf192icon.png">
  <link rel="shortcut icon" href="./AskIf192icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./AskIf192icon.png">
  <meta name="theme-color" content="#0d0f12">

  <!-- 🛡️ 嚴格 CSP 安全防線 (放行 Worker 連線與 jsdelivr 資源) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://jackylawck.github.io;
    font-src 'self' data:;
    connect-src 'self' https://askif-relay.jackylawck.workers.dev wss://askif-relay.jackylawck.workers.dev https://cdn.jsdelivr.net;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), gyroscope=(), microphone=(), camera=(), geolocation=(), payment=()">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <style>
    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      background: #21262d;
      padding: 0.2rem;
      border-radius: 6px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- 頂部導航列：返回首頁 + 房號狀態 + 雙語切換 + 開大螢幕 -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; flex-wrap:wrap; gap:0.75rem;">
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <button class="btn" id="btn-back-home" style="font-size:0.8rem; padding:0.35rem 0.65rem;" data-i18n="backHome">← 返回首頁</button>
      <div>
        <h2 style="margin:0; font-size:1.3rem;">
          <span data-i18n="room">房號</span>：<span id="room-id-label" style="color:var(--accent);">------</span>
        </h2>
        <span class="badge badge-online" id="sync-badge" data-i18n="syncCloudOnline">連線同步中...</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:0.6rem;">
      <div class="lang-switcher">
        <button class="lang-btn" id="btn-zh" onclick="window.switchHostLang('zh')">繁中</button>
        <button class="lang-btn" id="btn-en" onclick="window.switchHostLang('en')">EN</button>
      </div>
      <a class="btn btn-primary" id="open-display-btn" target="_blank" style="font-size:0.8rem; padding:0.4rem 0.8rem;" data-i18n="openDisplayBtn">🖥️ 開大螢幕</a>
    </div>
  </div>

  <!-- 觀眾加入 QR Code 提示卡片 -->
  <div class="card" style="display:flex; gap:1.2rem; align-items:center;">
    <div class="qr-box" id="host-qr" style="background:#fff; padding:6px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; min-width:84px; min-height:84px;"></div>
    <div>
      <p style="font-weight:600; margin:0;" data-i18n="scanQrHint">📱 觀眾現場掃碼加入</p>
      <p style="font-size:0.75rem; margin:0.35rem 0 0; color:var(--text-muted);" data-i18n="destroyHint">純記憶體運作，關閉分頁即物理銷毀。</p>
    </div>
  </div>

  <!-- 待審隊列 -->
  <h3 style="margin-top:1.5rem; font-size:1.1rem;">
    <span data-i18n="inboxTitle">📥 待審題庫</span> (<span id="inbox-count">0</span>)
  </h3>
  <div id="inbox-list"></div>

  <!-- 候選池與大螢幕推題 -->
  <h3 style="margin-top:1.5rem; font-size:1.1rem;">
    <span data-i18n="approvedTitle">🚀 候選與大螢幕推題</span> (<span id="approved-count">0</span>)
  </h3>
  <div id="approved-list"></div>

  <script type="module">
    import { applyI18n, getSavedLang } from './js/i18n.js';

    let currentLang = getSavedLang();
    applyI18n(currentLang);

    window.switchHostLang = function(lang) {
      currentLang = lang;
      applyI18n(lang);
      if (typeof window.renderHostLists === 'function') {
        window.renderHostLists();
      }
    };
  </script>
  <script type="module" src="./js/host.js"></script>
</body>
</html>
