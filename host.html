<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskIf — 主持人戰情 Pad</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <div>
      <h2>房號：<span id="room-id-label" style="color:var(--accent);">------</span></h2>
      <span class="badge badge-online" id="sync-badge">連線同步中...</span>
    </div>
    <div style="text-align:right;">
      <a class="btn" id="open-display-btn" target="_blank" style="font-size:0.8rem; padding:0.4rem 0.8rem;">🖥️ 開大螢幕</a>
    </div>
  </div>

  <div class="card" style="display:flex; gap:1rem; align-items:center;">
    <div class="qr-box" id="host-qr"></div>
    <div>
      <p style="font-weight:600;">📱 觀眾現場掃碼加入</p>
      <p style="font-size:0.75rem; margin-top:0.25rem;">純記憶體運作，關閉分頁即物理銷毀。</p>
    </div>
  </div>

  <h3 style="margin-top:1.5rem; font-size:1.1rem;">📥 待審題庫 (<span id="inbox-count">0</span>)</h3>
  <div id="inbox-list"></div>

  <h3 style="margin-top:1.5rem; font-size:1.1rem;">🚀 候選與大螢幕推題 (<span id="approved-count">0</span>)</h3>
  <div id="approved-list"></div>

  <script type="module" src="./js/host.js"></script>
</body>
</html>
