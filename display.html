<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AskIf — 現場大螢幕 | Live Stage Display</title>

  <!-- 📱 圖示與 PWA 支援 -->
  <link rel="icon" type="image/png" sizes="192x192" href="./AskIf192icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./AskIf192icon.png">
  <meta name="theme-color" content="#0d0f12">

  <!-- 🛡️ CSP 安全防線 (放行 Cloudflare Worker WebSocket 與 CDN 二維碼庫) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://jackylawck.github.io;
    font-src 'self' data:;
    connect-src 'self' https://askif-relay.jackylawck.workers.dev wss://askif-relay.jackylawck.workers.dev;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), gyroscope=(), microphone=(), camera=(), geolocation=(), payment=()">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0d0f12; color:#fff; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width:100vw; height:100vh; overflow:hidden; user-select:none;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition: cursor 0.2s;
    }
    body.hide-cursor {
      cursor: none;
    }
    #idle-view { text-align:center; transition:opacity 0.3s; }
    .qr-card { background:#fff; padding:16px; border-radius:16px; display:inline-block; margin:2vmin 0; }
    #spotlight-view {
      display:none; text-align:center; padding:0 8vmin; max-width:90%;
      animation: zoomIn 0.22s cubic-bezier(0, 0, 0.2, 1);
    }
    @keyframes zoomIn { from { transform: scale(0.92); opacity:0; } to { transform: scale(1); opacity:1; } }
    .spot-text { font-size: clamp(2.5rem, 6vmin, 6rem); font-weight:700; line-height:1.35; word-break:break-word; }
    .spot-meta { margin-top:3vmin; font-size: clamp(1.2rem, 2.5vmin, 2.5rem); color:#4a9eff; font-weight:700; }
    
    /* 右下角迷你 QR 附帶說明標籤 */
    #mini-qr-box {
      position:fixed; bottom:3vmin; right:3vmin; display:none;
      background:rgba(22, 27, 34, 0.9); border:1px solid #30363d;
      padding:10px; border-radius:12px; text-align:center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #mini-qr { background:#fff; padding:6px; border-radius:6px; display:inline-block; }
    .mini-qr-label {
      font-size:0.75rem; color:#8b949e; margin-top:4px; font-weight:500;
    }
  </style>
</head>
<body>
  <!-- 閒置等待畫面 -->
  <div id="idle-view">
    <h1 style="font-size:clamp(2rem, 4.2vmin, 3.8rem); font-weight:700; letter-spacing:1px;">
      現場提問與互動 <span style="font-size:0.65em; color:#8b949e; font-weight:400;">/ Live Q&amp;A</span>
    </h1>
    <div class="qr-card" id="main-qr"></div>
    <p id="room-code-label" style="font-size:clamp(1.4rem, 2.8vmin, 2.2rem); color:#4a9eff; font-weight:700; letter-spacing:2px;">房號 Room: ------</p>
    <p style="color:#9aa0a6; font-size:clamp(1rem, 1.8vmin, 1.4rem); margin-top:1.2vmin;">
      掃描 QR Code 提交問題或附議 · Scan to submit questions or upvote
    </p>
  </div>

  <!-- 焦點推題大畫面 -->
  <div id="spotlight-view">
    <div class="spot-text" id="spot-text">載入中 / Loading...</div>
    <div class="spot-meta" id="spot-upvotes">+0 附議 / Upvotes</div>
  </div>

  <!-- 右下角迷你 QR Container -->
  <div id="mini-qr-box">
    <div id="mini-qr"></div>
    <div class="mini-qr-label">掃碼參與 / Join Live</div>
  </div>

  <script type="module" src="./js/display.js"></script>

  <script>
    // 1. 雙擊全螢幕切換（現場投影必備便利功能）
    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 2. 滑鼠靜止 3 秒後自動淡出隱藏游標，移動時立即恢復
    let cursorTimer = null;
    document.addEventListener('mousemove', () => {
      document.body.classList.remove('hide-cursor');
      clearTimeout(cursorTimer);
      cursorTimer = setTimeout(() => {
        document.body.classList.add('hide-cursor');
      }, 3000);
    });
  </script>
</body>
</html>
